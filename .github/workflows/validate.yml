name: Validate gallery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/gallery.py verify-files
      - run: python tools/gallery.py validate --all
      - run: python tools/gallery.py build --all
      - run: python -m unittest discover -s tests -v

